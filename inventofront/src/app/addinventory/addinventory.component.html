
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="card-title text-center mb-4">
            <i class="fas fa-plus-square"></i> Add Inventory
          </h2>

          <!-- Office Selector -->
          <div class="mb-4">
            <label for="officeSelector" class="form-label">Select Office:</label>
            <app-office-selector-component 
              id="officeSelector" 
              (officeSelected)="onOfficeSelected($event)">
            </app-office-selector-component>
          </div>
          <div *ngIf="selectedOffice">
                 <!-- Choice Selection -->
          <div *ngIf="!uploadChoice" class="text-center mb-4">
            <h4>How would you like to add inventory?</h4>
            <div class="d-flex justify-content-center gap-2">
              <button 
                class="btn btn-primary" 
                (click)="onChoiceSelection('excel')">
                Upload from Excel
              </button>
              <button 
                class="btn btn-primary" 
                (click)="onChoiceSelection('form')">
                Upload from Form
              </button>
            </div>
          </div>

          <!-- Excel Upload Section -->
          <div *ngIf="uploadChoice === 'excel'" class="mb-4">
            <h4 class="text-center mb-4">Upload from Excel</h4>
            <div class="mb-3">
              <label for="excelFile" class="form-label">
                <i class="fas fa-file-excel"></i> Import from Excel
              </label>
              <input 
                type="file" 
                class="form-control" 
                id="excelFile" 
                (change)="onFileChange($event)" 
                accept=".xlsx, .xls">
            </div>
          </div>

          <!-- Manual Form Section -->
          <div *ngIf="uploadChoice === 'form'" class="mb-4">
            <h4 class="text-center mb-4">Fill Inventory Details</h4>
            <form [formGroup]="inventoryForm" (ngSubmit)="onSubmit()">
              <div class="mb-3" *ngFor="let field of formFields">
                <label [for]="field.id" class="form-label">
                  <i [ngClass]="field.icon"></i> {{ field.label }}
                </label>

                <!-- Input Field -->
                <input 
                  *ngIf="field.type === 'input'" 
                  type="text" 
                  class="form-control" 
                  [id]="field.id" 
                  [formControlName]="field.controlName">

                <!-- Select Dropdown -->
                <select 
                  *ngIf="field.type === 'select'" 
                  class="form-select" 
                  [id]="field.id" 
                  [formControlName]="field.controlName" 
                  (change)="field.changeEvent && field.changeEvent($event)">
                  <option value="" disabled selected>{{ field.placeholder }}</option>
                  <option 
                    *ngFor="let option of field.options" 
                    [value]="option">
                    {{ option }}
                  </option>
                </select>

                <!-- Textarea -->
                <textarea 
                  *ngIf="field.type === 'textarea'" 
                  class="form-control" 
                  [id]="field.id" 
                  [formControlName]="field.controlName">
                </textarea>

                <!-- Validation Error -->
                <div 
                  *ngIf="inventoryForm.get(field.controlName)?.invalid && inventoryForm.get(field.controlName)?.touched" 
                  class="alert alert-danger mt-2">
                  {{ field.error }}
                </div>
              </div>

              <!-- Submit Button -->
              <button 
                type="submit" 
                class="btn btn-primary w-100 mt-3" 
                [disabled]="inventoryForm.invalid">
                <i class="fas fa-paper-plane"></i> Submit
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
        


<!-- Custom Brand Modal -->
<ng-template #customBrandModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Add Custom Brand</h5>
    <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss()"></button>
  </div>
  <div class="modal-body">
    <div class="mb-3">
      <label for="customBrand" class="form-label">Custom Brand</label>
      <input type="text" class="form-control" id="customBrand" #customBrandInput>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="modal.dismiss()">Close</button>
    <button type="button" class="btn btn-primary" (click)="addCustomBrand(customBrandInput.value)">Add Brand</button>
  </div>
</ng-template>

<!-- Custom Type Modal -->
<ng-template #customTypeModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Add Custom Type</h5>
    <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss()"></button>
  </div>
  <div class="modal-body">
    <div class="mb-3">
      <label for="customType" class="form-label">Custom Type</label>
      <input type="text" class="form-control" id="customType" #customTypeInput>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="modal.dismiss()">Close</button>
    <button type="button" class="btn btn-primary" (click)="addCustomType(customTypeInput.value)">Add Type</button>
  </div>
</ng-template>

<!-- Excel Data Modal -->

<ng-template #excelDataModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Confirm Excel Data</h5>
    <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss()"></button>
  </div>
  <div class="modal-body">
    <p>Are you sure you want to add the following data?</p>
    <div class="table-responsive">
      <table class="table table-bordered table-striped">
        <thead>
          <tr>
            <th *ngFor="let field of formFields">{{ field.label }}</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of excelData">
            <td *ngFor="let field of formFields">{{ item[field.id] }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="modal.dismiss()">Cancel</button>
    <button type="button" class="btn btn-primary" (click)="onConfirm()">Confirm</button>
  </div>
</ng-template>
